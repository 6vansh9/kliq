name: Kliq
options:
  bundleIdPrefix: dev.vansh
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  Kliq:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Kliq/Sources
      - path: Kliq/Assets.xcassets
      - path: Kliq/Resources/Sounds
        type: folder
        buildPhase: resources
      - path: tools/import_mechvibes.py
        buildPhase: resources
    info:
      path: Kliq/Info.plist
      properties:
        CFBundleName: Kliq
        CFBundleDisplayName: Kliq
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright © 2026 Vansh. All rights reserved."
    settings:
      base:
        PRODUCT_NAME: Kliq
        PRODUCT_BUNDLE_IDENTIFIER: dev.vansh.Kliq
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES
